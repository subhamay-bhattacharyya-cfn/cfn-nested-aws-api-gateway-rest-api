AWSTemplateFormatVersion: '2010-09-09'

Description: 'Nested CloudFormation template to create an API Gateway REST API'

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Common Bucket Configuration"
        Parameters:
          - ProjectName
          - Environment
      - Label:
          default: "API Configuration"
        Parameters:
          - ApiBaseName
          - ApiDescription
          - EndpointConfigurationType
          - CreateRestApi
          - PathPart
      - Label:
          default: "Advanced Configuration"
        Parameters:
          - CiSuffix
    ParameterLabels:
      ProjectName:
        default: "Project Name"
      ApiBaseName:
        default: "API Base Name"
      ApiDescription:
        default: "API Description"
      EndpointConfigurationType:
        default: "Endpoint Configuration Type"
      CreateRestApi:
        default: "Create REST API"
      PathPart:
        default: "Path Part"
      Environment:
        default: "Environment"
      CiSuffix:
        default: "CI Suffix"

Parameters:
  ProjectName:
    Type: String
    Default: "cfn-nested"
    Description: "Project name to use as a bucket prefix"
    MinLength: 1
    MaxLength: 20
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Project name must be lowercase letters, numbers, and hyphens only"

  ApiBaseName:
    Type: String
    Default: "api"
    MinLength: 1
    MaxLength: 20
    AllowedPattern: "^[a-z0-9.-]+$"
    ConstraintDescription: "API base name must be 1-20 characters and can only contain lowercase letters, numbers, hyphens, and dots"
    Description: Base name for the API Gateway REST API (account ID, environment, and region will be appended)

  ApiDescription:
    Type: String
    Default: "API Description"
    MaxLength: 1024
    Description: "Description of the API Gateway REST API"

  EndpointConfigurationType:
    Type: String
    Default: "REGIONAL"
    AllowedValues:
      - "REGIONAL"
      - "EDGE"
      - "PRIVATE"
    Description: "Endpoint type of the API Gateway REST API. REGIONAL serves clients in the same Region, EDGE uses a CloudFront distribution, and PRIVATE is reachable only from within a VPC through an interface VPC endpoint."

  CreateRestApi:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: "Whether to create the API Gateway REST API. Set to false to skip the REST API, its resources, and the outputs."

  PathPart:
    Type: String
    Default: "orders"
    MinLength: 1
    MaxLength: 256
    AllowedPattern: "^[a-zA-Z0-9._-]+$"
    ConstraintDescription: "Path part must be 1-256 characters and can only contain letters, numbers, periods, underscores, and hyphens"
    Description: "Path segment created under the REST API root for the new API Gateway resource"

  Environment:
    Type: String
    Default: "devl"
    AllowedValues: 
      - "devl"
      - "test"
      - "prod"
    Description: "Deployment environment for the S3 bucket"

  CiSuffix:
    Type: String
    Default: ""
    Description: "Optional CI prefix to append to the bucket name"

Conditions:
  HasCiSuffix: !Not [!Equals [!Ref CiSuffix, ""]]
  ShouldCreateRestApi: !Equals [!Ref CreateRestApi, "true"]

Resources:
  RestApi:
    Type: AWS::ApiGateway::RestApi
    Condition: ShouldCreateRestApi
    Metadata:
      com.aws.cloudformation.Context:
        why: "API Gateway REST API entry point for the project. Methods, resources, and a deployment are not yet defined."
        must:
          - "Must tag the API with ProjectName and Environment for cost allocation and ownership tracking"
    Properties:
      Name: !If
        - HasCiSuffix
        - !Sub '${ProjectName}-${ApiBaseName}-${AWS::AccountId}-${Environment}-${AWS::Region}-${CiSuffix}'
        - !Sub '${ProjectName}-${ApiBaseName}-${AWS::AccountId}-${Environment}-${AWS::Region}'
      Description: !Ref ApiDescription
      EndpointConfiguration:
        Types:
          - !Ref EndpointConfigurationType
      Tags:
        - Key: ProjectName
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  RestApiResource:
    Type: AWS::ApiGateway::Resource
    Condition: ShouldCreateRestApi
    Metadata:
      com.aws.cloudformation.Context:
        why: "Adds the path segment set by PathPart (default /orders) directly under the REST API root. Endpoints are attached to this resource as child resources and methods."
        trust:
          src: infer
          conf: low
          note: "rationale not documented"
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: !Ref PathPart

Outputs:
  RestApiId:
    Condition: ShouldCreateRestApi
    Description: "ID of the API Gateway REST API"
    Value: !Ref RestApi

  RestApiRootResourceId:
    Condition: ShouldCreateRestApi
    Description: "Root resource ID of the API Gateway REST API"
    Value: !GetAtt RestApi.RootResourceId